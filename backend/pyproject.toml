[project]
name = "marin"
version = "0.1.0"
description = "Marin: prognose for når lusetallene på et oppdrettsanlegg kan nå lusegrensen"
requires-python = ">=3.14"
dependencies = [
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
